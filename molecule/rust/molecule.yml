---
# See ../../.config/molecule/config.yml for the Molecule configuration
# that is shared among all scenarios.  Any values set here will
# override the values in that file.
scenario:
  name: rust
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Our rust tests take place in Ansible and are self-contained.
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
